name: Build and run tests

on:
    push:
        branches:
            - '!refs/heads/riseclipse/master'
    pull_request:

jobs:
  build:
    # Use a specific version to avoid unattended changes with latest
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout ${{ github.event.repository.name }}
      uses: actions/checkout@v6
      with:
        path: ${{ github.event.repository.name }}

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'oracle'
        java-version: '21'
        cache: 'maven'

    - name: Test with Maven
      run: |
        cd ${{ github.event.repository.name }}
        xvfb-run mvn -f releng/org.eclipse.ocl.releng.tycho/pom.xml -DGOAL=test -DJAVADOC= -DPDFDOC= -DBUILD_TYPE=nightly --show-version clean test -Pnightly
